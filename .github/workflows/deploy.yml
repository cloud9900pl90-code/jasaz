name: Deploy Cloudflare Pages & Setup Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Ensure Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create jasaz --production-branch=main || true

      - name: Sync Secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
        run: |
          echo "Setting up environment secrets in Cloudflare Pages..."
          # مقداردهی سکرت‌ها برای Pages
          echo "$TELEGRAM_BOT_TOKEN" | wrangler pages secret put BOT_TOKEN --project-name=jasaz
          echo "$TELEGRAM_SECRET_TOKEN" | wrangler pages secret put BOT_SECRET --project-name=jasaz

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # دیپلوی و ذخیره لاگ
          OUTPUT=$(wrangler pages deploy public --project-name=jasaz --commit-dirty=true)
          echo "$OUTPUT"

          # استخراج دامنه اصلی pages.dev با Regex
          PAGES_URL=$(echo "$OUTPUT" | grep -o 'https://[^ ]*\.pages\.dev' | head -n 1)
          
          # فال‌بک در صورتی که دامین اختصاصی jasaz.pages.dev باشد
          if [ -z "$PAGES_URL" ]; then
            PAGES_URL="https://jasaz.pages.dev"
          fi

          echo "Detected Pages URL: $PAGES_URL"
          echo "pages_url=$PAGES_URL" >> $GITHUB_OUTPUT

      - name: Auto-Register Telegram Webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
          PAGES_URL: ${{ steps.pages_deploy.outputs.pages_url }}
        run: |
          WEBHOOK_URL="${PAGES_URL}/api/telegram-bot"
          echo "Registering Webhook: $WEBHOOK_URL"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{
              \"url\": \"${WEBHOOK_URL}\",
              \"secret_token\": \"${TELEGRAM_SECRET_TOKEN}\",
              \"drop_pending_updates\": false
            }")

          echo "Telegram Response: $RESPONSE"

          # اعتبارسنجی پاسخ تلگرام
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Telegram Webhook registered successfully!"
          else
            echo "❌ Failed to register Telegram Webhook!"
            exit 1
          fi
