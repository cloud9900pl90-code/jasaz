
name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Ensure Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create jasaz --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(wrangler pages deploy public --project-name=jasaz --commit-dirty=true)
          echo "$OUTPUT"

          PROJECT_NAME="jasaz"
          CANONICAL_URL="https://${PROJECT_NAME}.pages.dev"

          echo "Canonical URL: $CANONICAL_URL"
          echo "pages_url=$CANONICAL_URL" >> $GITHUB_OUTPUT
